name: Publish OSM packs

on:
  workflow_dispatch:
  schedule:
    # OSM extracts refresh often enough for a weekly republish.
    - cron: "0 6 * * 1" # Monday 06:00 UTC

permissions:
  contents: write

concurrency:
  group: publish-packs
  cancel-in-progress: false

env:
  PACKS_TAG: packs

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -euo pipefail
          # Australia PBF is ~1 GB; osmium indexes + CSV + gzip need headroom.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Read current published packs
        id: current
        run: |
          set -euo pipefail
          base="https://github.com/${{ github.repository }}/releases/download/${PACKS_TAG}"
          road_sha=""; road_ts=""; school_sha=""
          if curl -fsSL -A "Pace-packs-ci" -o /tmp/cur-pack.json "${base}/pack-manifest.json"; then
            road_sha="$(python -c 'import json;print(json.load(open("/tmp/cur-pack.json")).get("sha256",""))')"
            road_ts="$(python -c 'import json;print(json.load(open("/tmp/cur-pack.json")).get("osmTimestamp",""))')"
          fi
          if curl -fsSL -A "Pace-packs-ci" -o /tmp/cur-school.json "${base}/school-zones-manifest.json"; then
            school_sha="$(python -c 'import json;print(json.load(open("/tmp/cur-school.json")).get("sha256",""))')"
          fi
          echo "road_sha=${road_sha}" >> "$GITHUB_OUTPUT"
          echo "road_ts=${road_ts}" >> "$GITHUB_OUTPUT"
          echo "school_sha=${school_sha}" >> "$GITHUB_OUTPUT"
          echo "Current road osmTimestamp='${road_ts:-<none>}' sha='${road_sha:0:16}'"
          echo "Current school sha='${school_sha:0:16}'"

      - name: Decide whether the road pack needs rebuilding
        id: roaddecide
        run: |
          set -euo pipefail
          state_url="https://download.geofabrik.de/australia-oceania/australia-updates/state.txt"
          geo_ts="$(curl -fsSL -A "Pace-packs-ci" "$state_url" | sed -n 's/^timestamp=//p' | tr -d '\\' | tr -d '\r' | head -n1)"
          echo "Geofabrik osmTimestamp='${geo_ts}'"
          cur_ts="${{ steps.current.outputs.road_ts }}"
          if [ -z "$cur_ts" ] || { [ -n "$geo_ts" ] && [ "$geo_ts" '>' "$cur_ts" ]; }; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Road pack build needed ('${cur_ts:-<none>}' -> '${geo_ts}')."
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Road pack up to date at '${cur_ts}'."
          fi

      - name: Build road pack
        id: road
        if: steps.roaddecide.outputs.build == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist tools/cache
          python tools/build_road_pack.py --out-dir dist
          test -f dist/road_pack.csv.gz
          test -f dist/pack-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("dist/pack-manifest.json").read_text())
          assert m.get("sha256"), "missing sha256"
          assert m.get("osmTimestamp"), "missing osmTimestamp"
          assert Path("dist/road_pack.csv.gz").stat().st_size == m["bytes"]
          print("road manifest ok:", m["osmTimestamp"], m["sha256"][:16] + "…", m["bytes"], "bytes")
          PY
          new_sha="$(python -c 'import json;print(json.load(open("dist/pack-manifest.json"))["sha256"])')"
          echo "new_sha=${new_sha}" >> "$GITHUB_OUTPUT"
          # Reclaim the ~1 GB extract before uploading.
          rm -rf tools/cache
          df -h /

      - name: Build Queensland school zones
        id: school
        run: |
          set -euo pipefail
          mkdir -p dist tools/cache
          python tools/build_qld_school_zones.py --out dist/qld_school_zones.csv.gz
          test -f dist/qld_school_zones.csv.gz
          test -f dist/school-zones-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("dist/school-zones-manifest.json").read_text())
          assert m.get("sha256"), "missing sha256"
          assert Path("dist/qld_school_zones.csv.gz").stat().st_size == m["bytes"]
          print("school manifest ok:", m["osmTimestamp"], m["sha256"][:16] + "…", m["bytes"], "bytes")
          PY
          new_sha="$(python -c 'import json;print(json.load(open("dist/school-zones-manifest.json"))["sha256"])')"
          echo "new_sha=${new_sha}" >> "$GITHUB_OUTPUT"
          rm -rf tools/cache
          df -h /

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          road_new="${{ steps.road.outputs.new_sha }}"
          road_old="${{ steps.current.outputs.road_sha }}"
          school_new="${{ steps.school.outputs.new_sha }}"
          school_old="${{ steps.current.outputs.school_sha }}"

          road_changed=false
          if [ -n "$road_new" ] && [ "$road_new" != "$road_old" ]; then road_changed=true; fi
          school_changed=false
          if [ -n "$school_new" ] && [ "$school_new" != "$school_old" ]; then school_changed=true; fi

          echo "road_changed=${road_changed} school_changed=${school_changed}"
          if [ "$road_changed" != "true" ] && [ "$school_changed" != "true" ]; then
            echo "No pack changes. Nothing to publish."
            exit 0
          fi

          notes="$(cat <<'MD'
          Rolling OSM packs for Pace (road speed limits + Queensland school zones).

          Pace polls this release's `pack-manifest.json` and `school-zones-manifest.json`
          on start and downloads newer `*.csv.gz` assets over unmetered networks.

          Road data © OpenStreetMap contributors, [ODbL 1.0](https://opendatacommons.org/licenses/odbl/).
          MD
          )"

          if ! gh release view "$PACKS_TAG" >/dev/null 2>&1; then
            gh release create "$PACKS_TAG" \
              --title "Pace OSM packs" \
              --notes "$notes" \
              --latest
          else
            gh release edit "$PACKS_TAG" --notes "$notes" --latest
          fi

          assets=()
          if [ "$road_changed" = "true" ]; then
            assets+=("dist/pack-manifest.json" "dist/road_pack.csv.gz")
          fi
          if [ "$school_changed" = "true" ]; then
            assets+=("dist/school-zones-manifest.json" "dist/qld_school_zones.csv.gz")
          fi
          gh release upload "$PACKS_TAG" "${assets[@]}" --clobber
          echo "Published ${PACKS_TAG}: road_changed=${road_changed} school_changed=${school_changed}"
